<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoolBreeze - Inbox</title>
 <link rel="stylesheet" href="message.css">
 <link rel="icon" type="image/x-icon" href="COOLBREEZELOGO.png">

 
<header>
  <img src="COOLBREEZELOGO.png" alt="icon" style="width: 50px;" height="50px"> <div>CoolBreeze</div>
  <nav>
    <a href="group.html">Home</a>
    <a href="services.html">Services</a>
    <a href="about.html">About</a>
    <a href="message.html">Inbox</a>
    
  </nav>
</header>


<div class="menu-btn" onclick="toggleMenu()">☰</div>


<div id="sideMenu" class="side-menu">
  <span class="close-btn" onclick="toggleMenu()">×</span>

  <form id="serviceForm">
    <label>First Name:</label>
    <input type="text" id="firstName" placeholder="Your First Name" required>

    <label>Last Name:</label>
    <input type="text" id="lastName" placeholder="Your Last Name" required>

    <label>Email:</label>
    <input type="email" id="email" placeholder="Your Email" required>

    <label>Phone:</label>
    <input type="text" id="phone" placeholder="Your Phone Number" required>

    <label>Address:</label>
    <input type="text" id="address" placeholder="Your Address" required>

    <label>Select:</label>
    <select id="service" required>
      <option value="" disabled selected>Select a service</option>
      <option>Installation</option>
      <option>Cleaning</option>
      <option>Repair/Troubleshooting</option>
      <option>Relocation/Installation</option>
      <option>Drain Cleaning</option>
      <option>Electrical Fixes</option>
    </select>

    <label>Message:</label>
    <textarea id="message" rows="4" placeholder="Write something..." required></textarea>

   <button type="submit">Submit</button>

  </form>
</div>


<div class="container">
  <div class="sidebar" id="appointmentList">
    <div class="empty">No appointments found.</div>
  </div>

  <div class="details" id="appointmentDetails">
    <h2>Appointment Details</h2>
    <p>Select an appointment from the left to view full details.</p>
  </div>
</div>

<script src="message.js"></script>

</body>
</html>
